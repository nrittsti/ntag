name: "Build Release"

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  linux_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_ntag_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11
      - name: Build Linux Version with Maven
        id: build-linux
        run: mvn clean package
      - name: Get NTag version
        id: get_ntag_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create SHA256 Checksum
        run: sha256sum ./target/ntag-${{ env.VERSION }}-linux_bin.tar.gz > ./target/ntag-${{ env.VERSION }}-linux_bin_sha256.txt
      - name: Upload Linux Release Asset
        id: upload-linux-release-asset
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./target/ntag-${{ env.VERSION }}-linux_bin.tar.gz
          name: ntag-${{ env.VERSION }}-linux_bin.tar.gz
          retention-days: 7
      - name: Upload Linux Checksum SHA256 Asset
        id: upload-linux-checksum-asset
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./target/ntag-${{ env.VERSION }}-linux_bin_sha256.txt
          name: ntag-${{ env.VERSION }}-linux_bin_sha256.txt
          retention-days: 7
  windows_release:
    needs: linux_release
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.linux_release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11
      - name: Build Windows Version with Maven
        id: build-windows
        run: mvn clean package
      - name: Create SHA256 Checksums
        id: checksums
        run: |
          Get-Filehash ./target/ntag-${{ env.VERSION }}-win_bin.zip -Algorithm SHA256 | Format-List -Property Hash > ./target/ntag-${{ env.VERSION }}-win_bin_sha256.txt
      - name: Upload Windows ZIP Release Asset
        id: upload-win-release-asset
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./target/ntag-${{ env.VERSION }}-win_bin.zip
          name: ntag-${{ env.VERSION }}-win_bin.zip
          retention-days: 7
      - name: Upload Windows ZIP SHA256 Asset
        id: upload-win-bin-sha256-asset
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ./target/ntag-${{ env.VERSION }}-win_bin_sha256.txt
          name: ntag-${{ env.VERSION }}-win_bin_sha256.txt
          retention-days: 7
  create_release:
    runs-on: ubuntu-latest
    needs:
      - linux_release
      - windows_release
    env:
      VERSION: ${{ needs.linux_release.outputs.version }}
    steps:
      - name: Download all artifcats
        uses: actions/download-artifact@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            /home/runner/work/ntag/ntag/ntag-${{ env.VERSION }}-linux_bin_sha256.txt/ntag-${{ env.VERSION }}-linux_bin_sha256.txt
            /home/runner/work/ntag/ntag/ntag-${{ env.VERSION }}-linux_bin.tar.gz/ntag-${{ env.VERSION }}-linux_bin.tar.gz
            /home/runner/work/ntag/ntag/ntag-${{ env.VERSION }}-win_bin_sha256.txt/ntag-${{ env.VERSION }}-win_bin_sha256.txt
            /home/runner/work/ntag/ntag/ntag-${{ env.VERSION }}-win_bin.zip/ntag-${{ env.VERSION }}-win_bin.zip